name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default: a plain `push` to main only builds and tests and
# therefore only needs to READ the repository. Permission to create/update a
# GitHub Release is granted to the separate `release` job below, which runs on
# v* tags only.
permissions:
  contents: read

jobs:
  build:
    name: Build, test & verify APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      head_sha: ${{ steps.commit.outputs.head_sha }}

    steps:
      - name: Checkout Repository (full history for correct SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show checked-out commit (must match latest main)
        id: commit
        run: |
          git log --oneline -5
          HEAD_SHA=$(git rev-parse --short=7 HEAD)
          echo "HEAD_SHA=$HEAD_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Single source of truth for the version: app/build.gradle.kts.
      # Nothing below may hardcode versionCode/versionName again.
      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          VC=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]\+\).*/\1/p' app/build.gradle.kts | head -n 1)
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$VC versionName=$VN"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      # The RELEASE keystore signs every official APK and lives ONLY in the
      # RELEASE_KEYSTORE_BASE64 repository secret (never in git). It is written
      # to the runner's temp dir — outside the workspace — and deleted at the end
      # of the job. The historical debug key is retired; see docs/SECURITY.md.
      - name: Restore release keystore (never from git)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/termchin-release.jks"
          MISSING=""
          [ -n "$RELEASE_KEYSTORE_B64" ] || MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -n "$RELEASE_KEYSTORE_PASSWORD" ] || MISSING="$MISSING RELEASE_KEYSTORE_PASSWORD"
          [ -n "$RELEASE_KEY_ALIAS" ] || MISSING="$MISSING RELEASE_KEY_ALIAS"
          [ -n "$RELEASE_KEY_PASSWORD" ] || MISSING="$MISSING RELEASE_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secret(s):$MISSING — refusing to build an unsigned release APK."
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KS"
          echo "RELEASE_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          # A certificate fingerprint is public data; print it so the log proves
          # which key the build was handed.
          keytool -list -v -keystore "$KS" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep -E 'Owner:|SHA256:' || true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      # A private signing key once lived in git history (see docs/SECURITY.md).
      # This gate makes sure no keystore/base64 material can ever be tracked
      # again: the distribution key must exist ONLY in the GitHub secret and on
      # the maintainer's machine.
      - name: Secret-hygiene gate (no signing material tracked in git)
        run: |
          LEAKED=$(git ls-files | grep -Ei '\.(jks|keystore|b64|base64)$|(^|/)debug\.keystore$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Signing material is tracked in git — remove it now (it must live only in the RELEASE_KEYSTORE_BASE64 secret):"
            echo "$LEAKED"
            exit 1
          fi
          echo "OK: no keystore/base64 file is tracked."

      # Fail fast: prove that the four RELEASE_* values actually WORK before the
      # multi-minute test/build steps. verifyReleaseSigning opens the keystore,
      # requires the alias to be a private-key entry and verifies both passwords,
      # so a typo'd or rotated secret is reported here in seconds.
      - name: Signing pre-flight (keystore, alias and passwords must work)
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew verifyReleaseSigning --no-configuration-cache --stacktrace

      # Tests gate the APK: a red suite must never produce a release artifact.
      - name: Unit tests (must pass before assembling)
        run: ./gradlew testDebugUnitTest --stacktrace

      # IMPORTANT: `clean` + --no-configuration-cache guarantees the APK is
      # rebuilt from current sources. Without clean, stale dex/resources from
      # the Gradle cache can make it look like "changes didn't land on APK".
      # The signing passwords are handed to THIS step only: the keystore path
      # arrives via $GITHUB_ENV from the restore step, but secrets exported as
      # step-level env in one step do not reach later steps.
      - name: Build Release APK (clean rebuild from current sources)
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-configuration-cache --stacktrace

      - name: Verify APK carries new version (fail if stale)
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lh app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "versionCode='$VERSION_CODE'|versionName='$VERSION_NAME'" \
            || (echo "::error::APK version mismatch: expected versionCode $VERSION_CODE / versionName $VERSION_NAME. Stale build?"; exit 1)

      # Official APKs must carry the CURRENT TermChin release certificate, and a
      # debug-signed APK must never reach a release. The constant below is the
      # public SHA-256 fingerprint of the release key generated for the 2026-09
      # migration (the historical debug key fcced2ea… is retired). A mismatch —
      # including a debug/throwaway signature — fails the build.
      - name: Signature gate (APK must carry the current release key)
        env:
          EXPECTED_SIGNER_SHA256: 0d38aa655105b0af6a0c0a1d26b37dbb872d20b6b4ab63fbeb9f88aa195adda0
          RETIRED_SIGNER_SHA256: fcced2ea0574ba6c7b9536c44846c2b697e1f841507af9e4ed00ed910bbe10ff
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found to verify."
            exit 1
          fi
          FP=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256 : $FP"
          echo "expected           : $EXPECTED_SIGNER_SHA256"
          # Explicit negative assertion, checked first: whatever the positive
          # comparison below says, the retired certificate must never appear
          # again. This is what keeps a cached/debug keystore from slipping
          # through a mis-wired build.
          if [ "$FP" = "$RETIRED_SIGNER_SHA256" ]; then
            echo "::error::APK is signed with the RETIRED (compromised) release certificate. That key must never sign anything again — refusing to publish."
            exit 1
          fi
          if [ "$FP" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK is not signed with the TermChin release key — refusing to publish. Check RELEASE_KEYSTORE_BASE64 / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD."
            exit 1
          fi
          echo "Signature matches the TermChin release key (and is not the retired one)."

      # TermChin's network surface is deliberately tiny: ONE permission
      # (INTERNET) used for a single unauthenticated HTTPS GET to api.github.com
      # to learn whether a newer release exists (app/src/main/.../update/).
      # OS-level backup stays disabled. Both are user-facing promises documented
      # in README.md and docs/SECURITY.md. Inspect the BUILT APK (merged
      # manifest) so a regression introduced by any dependency or build flag fails
      # here, not in review.
      - name: Network & backup gate (INTERNET only, OS backup disabled)
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found to inspect."
            exit 1
          fi
          echo "=== permissions declared by the APK ==="
          PERMS=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")
          echo "$PERMS"
          # Allow-list, not a deny-list: INTERNET is the ONLY *capability*
          # permission TermChin may ever request. Anything else (location,
          # contacts, storage, REQUEST_INSTALL_PACKAGES, ...) is a build failure,
          # because the app stores everything locally and hands APK downloads to
          # the browser.
          #
          # One exception is structural, not a capability: androidx merges the
          # app's own "<applicationId>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          # into every APK. It is a signature-level guard for dynamic receivers —
          # it protects the app's own broadcasts and grants zero access — so it
          # is expected on the allow-list. The package name is read from the APK
          # itself (both old and new `aapt` formats) rather than hardcoded.
          ALLOWED="android.permission.INTERNET"
          APP_ID=$(printf '%s\n' "$PERMS" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ -z "$APP_ID" ]; then
            APP_ID=$(printf '%s\n' "$PERMS" | sed -n "s/^package: \([^ ]*\).*/\1/p")
          fi
          SELF_GUARD="${APP_ID}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          if [ -z "$APP_ID" ]; then
            echo "::error::Could not read the package name from the APK."
            exit 1
          fi
          while read -r PERM; do
            [ -n "$PERM" ] || continue
            if [ "$PERM" != "$ALLOWED" ] && [ "$PERM" != "$SELF_GUARD" ]; then
              echo "::error::Release APK requests an unexpected permission: $PERM (only $ALLOWED and the app's own $SELF_GUARD are allowed)."
              exit 1
            fi
          done <<< "$(echo "$PERMS" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p")"
          if ! echo "$PERMS" | grep -q "$ALLOWED"; then
            echo "::error::Release APK no longer declares $ALLOWED - the update check could not work."
            exit 1
          fi
          echo "Permission surface OK: INTERNET (+ the app's own dynamic-receiver guard) — the update check is the sole network capability."
          echo "=== allowBackup in the merged manifest ==="
          ALLOW_BACKUP_LINE=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep "android:allowBackup" || true)
          echo "${ALLOW_BACKUP_LINE:-<allowBackup attribute absent>}"
          if [ -z "$ALLOW_BACKUP_LINE" ]; then
            echo "::error::android:allowBackup is missing from the merged manifest."
            exit 1
          fi
          case "$ALLOW_BACKUP_LINE" in
            *")0x0") echo "allowBackup=false — OS backup/device-transfer stays disabled." ;;
            *) echo "::error::android:allowBackup is not false — the OS would export user data off-device." ; exit 1 ;;
          esac

      # A release can no longer ship with an unchanged version: on v* tags the
      # tag must equal versionName and versionCode must be strictly greater
      # than the previous tag's versionCode (read from git history).
      - name: Version regression gate (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
            exit 1
          fi
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "First version tag — nothing to compare."
            exit 0
          fi
          PREV_VC=$(git show "$PREV_TAG:app/build.gradle.kts" 2>/dev/null | sed -n 's/^[[:space:]]*versionCode = \([0-9]\+\).*/\1/p' | head -n 1)
          if [ -z "$PREV_VC" ]; then
            echo "::warning::Could not read versionCode from $PREV_TAG — skipping comparison."
            exit 0
          fi
          if [ "$VERSION_CODE" -le "$PREV_VC" ]; then
            echo "::error::versionCode $VERSION_CODE is not greater than $PREV_TAG's versionCode $PREV_VC. Bump versionCode in app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode $VERSION_CODE > $PREV_TAG ($PREV_VC) — OK"

      - name: Prepare APK Asset (unique name busts CDN/browser cache)
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk "release-output/TermChin-v${VERSION_NAME}-${HEAD_SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-output/TermChin-v${VERSION_NAME}.apk"
          ls -la release-output/
          sha256sum release-output/*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermChin-v${{ env.VERSION_NAME }}-APK-${{ env.HEAD_SHA }}
          # Both assets must travel to the release job: the assertion there
          # requires the plain name AND the cache-busting name, and
          # action-gh-release publishes exactly these two paths.
          path: |
            release-output/TermChin-v${{ env.VERSION_NAME }}.apk
            release-output/TermChin-v${{ env.VERSION_NAME }}-${{ env.HEAD_SHA }}.apk

      # The restored keystore must not survive the job. RUNNER_TEMP is wiped
      # with the runner anyway; this makes the intent explicit and covers
      # self-hosted runners.
      - name: Remove restored release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/termchin-release.jks"

  # Only a v* tag publishes a GitHub Release, and only this job may write to the
  # repository. A push to `main` runs `build` alone with read-only permission, so
  # a branch build can never create a bogus release or steal "Latest".
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Re-export version metadata from the build job
        run: |
          echo "VERSION_NAME=${{ needs.build.outputs.version_name }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ needs.build.outputs.version_code }}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${{ needs.build.outputs.head_sha }}" >> "$GITHUB_ENV"

      - name: Download APK artifact produced by the build job
        uses: actions/download-artifact@v4
        with:
          name: TermChin-v${{ needs.build.outputs.version_name }}-APK-${{ needs.build.outputs.head_sha }}
          path: release-output

      - name: Assert both release assets are present
        run: |
          ls -la release-output/
          test -f "release-output/TermChin-v${VERSION_NAME}.apk" \
            || { echo "::error::missing release-output/TermChin-v${VERSION_NAME}.apk"; exit 1; }
          test -f "release-output/TermChin-v${VERSION_NAME}-${HEAD_SHA}.apk" \
            || { echo "::error::missing cache-busting asset TermChin-v${VERSION_NAME}-${HEAD_SHA}.apk"; exit 1; }
          sha256sum release-output/*.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TermChin ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🎓 TermChin | ترم‌چین — نسخه ${{ env.VERSION_NAME }}

            > ## ⚠️ اطلاعیهٔ مهم — حذف و نصب مجدد فقط برای نصب‌های قدیمی (تا v2.5.0)
            >
            > کلید امضای TermChin در نسخهٔ 2.6.0 عوض شد (`CN=Android Debug` ← `CN=TermChin Release`). بنابراین:
            > - اگر روی گوشی شما نسخه‌ای **تا v2.5.0** نصب است، این APK روی آن نصب *نمی‌شود* و اندروید خطای «برنامه نصب نشد» (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`) می‌دهد.
            > - اگر **v2.6.0 یا جدیدتر** نصب دارید، همین نسخه یک آپدیت معمولی است و نیازی به حذف اپ نیست.
            >
            > **اگر از نسخه‌های قدیمی (تا v2.5.0) می‌آیید، قبل از نصب یک‌بار این کارها را انجام دهید:**
            >
            > 1. در اپ قدیمی، «تنظیمات» ← **«خروجی دروس و گروه‌ها (Export)»**: متن JSON را کپی و بیرون از گوشی نگه دارید؛ و «خانه» ← **«خروجی و اشتراک‌گذاری برنامه»** برای ذخیرهٔ متن برنامهٔ هفتگی. ⚠️ این خروجی فقط دروس/گروه‌ها (و متن برنامه) را پوشش می‌دهد — **جزوات، عکس‌ها و تنظیمات ذخیره نمی‌شوند**؛ مستندات مهم را جداگانه نگه دارید.
            > 2. اپ را کامل **حذف (Uninstall)** کنید — حذف، دیتابیس داخلی را پاک می‌کند.
            > 3. همین نسخه را نصب کنید و JSON را از «تنظیمات» ← **«ورود داده با فرمت JSON»** برگردانید.
            >
            > جزئیات فنی: `docs/SECURITY.md`.
            >
            > ⚠️ **English:** TermChin has been signed with `CN=TermChin Release` since v2.6.0. If you are already on **v2.6.0 or newer**, this APK is a normal update. If you are on **v2.5.0 or older** (retired `CN=Android Debug` key), it cannot install as an update (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`): back up first (Settings → Export JSON — covers courses/groups only, not attachments/settings), uninstall once, install this APK, re-import via Settings → JSON import. Details: `docs/SECURITY.md`.


            ### ✨ جدید در این نسخه:
            - 🎨 **بومِ خنثی در همهٔ تم‌ها:** پس‌زمینه، کارت‌ها، متن‌ها و خطوط دیگر رنگِ تم را نمی‌گیرند (طوسی با همان روشنایی — همهٔ کنتراست‌ها حفظ)؛ تمِ جنگلی دیگر «کاملاً سبز» نیست و رنگ فقط از اکسنت‌ها می‌آید
            - 🎨 **ترکیب رنگ حرفه‌ای هر ۷ تم:** سه رنگِ هویتی هر تم (primary/secondary/tertiary) با فاصلهٔ رنگی ۳۶ تا ۱۸۰ درجه؛ مثلثِ رنگ هر تم در روشن و تاریک جداگانه بررسی می‌شود
            - ✅ **تست جدید رگرسیون رنگ:** تست خودکار chroma کرومِ صفحه (≤ ۶) و اکسنت‌ها (≥ ۳۰) را در هر ۱۴ اسکیم چک می‌کند؛ کنتراست WCAG همگی پاس

            > بعد از نصب، در صفحه «تنظیمات» پایین صفحه باید `v${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})` و هش کامیت جدید را ببینید.
          files: |
            release-output/TermChin-v${{ env.VERSION_NAME }}.apk
            release-output/TermChin-v${{ env.VERSION_NAME }}-${{ env.HEAD_SHA }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

